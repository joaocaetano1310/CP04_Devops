# ========================================================================
# Perfil: DOCKER - MySQL em container (local e Azure Container Instances)
# ------------------------------------------------------------------------
# Todos os valores vem de variaveis de ambiente. Nenhuma credencial
# esta gravada neste arquivo.
# ========================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema e criado pelo script db/init.sql na inicializacao do container.
# 'update' apenas reconcilia eventuais diferencas, sem recriar tabelas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Aguarda o banco ficar disponivel antes de falhar
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
