# ========================================================================
# AgroVision - Configuracoes base
# ------------------------------------------------------------------------
# ATENCAO: nenhuma credencial deve ser gravada neste arquivo.
# Todo dado sensivel e injetado por variavel de ambiente no deploy.
# ========================================================================
spring.application.name=agrovision
spring.profiles.active=${SPRING_PROFILES_ACTIVE:docker}

# ---------------- JPA ----------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------- Springdoc / Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------- JWT ----------------
# Definido pela variavel de ambiente JWT_SECRET (obrigatoria em producao)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
